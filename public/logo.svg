<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <!-- Shadow filter for 3D depth matching uploaded logo -->
    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <!-- 1. SPROUTING TREE BRANCHES -->
    <!-- Main stem rising from hanger hook -->
    <path d="M72 170 C70 145, 62 135, 30 115" stroke="#78350F" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <path d="M52 138 C60 120, 68 100, 72 75" stroke="#78350F" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M68 98 C82 92, 94 92, 110 98" stroke="#78350F" stroke-width="3.5" stroke-linecap="round" fill="none" />
    <path d="M42 125 C45 105, 52 95, 60 85" stroke="#78350F" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M22 110 C32 100, 40 92, 48 85" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- COLORFUL LEAVES -->
    <!-- Top Magenta Leaf -->
    <path d="M72 75 C68 62, 72 50, 72 50 C72 50, 80 60, 78 72 Z" fill="#E11D48" />
    <!-- Pink Left Leaf -->
    <path d="M48 85 C42 75, 45 65, 45 65 C45 65, 55 72, 53 82 Z" fill="#F43F5E" />
    <!-- Cyan / Light Blue Leaf -->
    <path d="M48 95 C38 92, 35 84, 35 84 C35 84, 45 82, 50 90 Z" fill="#06B6D4" />
    <!-- Orange Left Leaf -->
    <path d="M28 115 C20 110, 18 100, 18 100 C18 100, 28 102, 30 112 Z" fill="#F97316" />
    <!-- Yellow / Gold Leaf -->
    <path d="M90 94 C98 84, 102 75, 102 75 C102 75, 92 84, 88 92 Z" fill="#FBBF24" />
    <!-- Teal Right Leaf -->
    <path d="M110 98 C120 95, 126 88, 126 88 C126 88, 116 95, 108 100 Z" fill="#0D9488" />
    <!-- Deep Rose Leaf -->
    <path d="M96 120 C108 122, 118 126, 118 126 C118 126, 106 122, 95 116 Z" fill="#BE123C" />
    <!-- Amber Bottom Leaf -->
    <path d="M85 138 C94 140, 104 146, 104 146 C104 146, 92 140, 82 134 Z" fill="#F59E0B" />

    <!-- 2. COAT HANGER -->
    <!-- Hook -->
    <path d="M72 170 C72 155, 84 150, 84 162 C84 172, 74 178, 72 188" stroke="#78350F" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Hanger triangular shoulders -->
    <path d="M22 210 L72 188 L122 210" stroke="#78350F" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round" fill="none" />

    <!-- 3. TEAL T-SHIRT -->
    <path d="M48 200 C58 208, 86 208, 96 200 L132 218 L118 244 L102 236 L102 290 L42 290 L42 236 L26 244 L12 218 Z" fill="#008A90" />
    <!-- Shirt bottom curve -->
    <path d="M42 290 Q72 295 102 290 L102 295 Q72 300 42 295 Z" fill="#007278" />

    <!-- 4. "Samia's" SCRIPT (Magenta / Raspberry Pink) -->
    <g fill="#D81B60">
      <!-- S -->
      <path d="M152 235 C150 205, 172 180, 192 180 C208 180, 218 190, 218 202 C218 218, 198 226, 178 234 C162 240, 150 248, 150 262 C150 280, 168 290, 186 290 C202 290, 214 282, 222 272 L228 282 C218 296, 202 305, 184 305 C156 305, 134 288, 134 260 C134 240, 148 225, 168 216 C186 208, 202 202, 202 192 C202 185, 196 180, 188 180 C176 180, 164 192, 162 212 Z" />
      
      <!-- a -->
      <path d="M226 265 C226 248, 238 238, 252 238 C262 238, 270 244, 274 252 L274 240 L288 240 L288 288 L276 288 L275 280 C270 286, 262 291, 250 291 C236 291, 226 279, 226 265 Z M274 265 C274 255, 268 248, 258 248 C248 248, 242 254, 242 264 C242 274, 248 280, 258 280 C268 280, 274 274, 274 265 Z" />
      
      <!-- m -->
      <path d="M298 240 L312 240 L312 248 C316 242, 324 238, 332 238 C342 238, 348 243, 352 250 C358 242, 366 238, 376 238 C390 238, 396 248, 396 264 L396 288 L382 288 L382 266 C382 255, 378 249, 370 249 C362 249, 356 256, 356 266 L356 288 L342 288 L342 266 C342 255, 338 249, 330 249 C322 249, 316 256, 316 266 L316 288 L298 288 Z" />
      
      <!-- i -->
      <path d="M408 240 L422 240 L422 288 L408 288 Z M408 220 C408 215, 412 211, 417 211 C422 211, 426 215, 426 220 C426 225, 422 229, 417 229 C412 229, 408 225, 408 220 Z" />
      
      <!-- a -->
      <path d="M434 265 C434 248, 446 238, 460 238 C470 238, 478 244, 482 252 L482 240 L496 240 L496 288 L484 288 L483 280 C478 286, 470 291, 458 291 C444 291, 434 279, 434 265 Z M482 265 C482 255, 476 248, 466 248 C456 248, 450 254, 450 264 C450 274, 456 280, 466 280 C476 280, 482 274, 482 265 Z" />

      <!-- Apostrophe ' -->
      <path d="M502 212 C502 204, 508 198, 516 198 C522 198, 526 202, 524 212 L518 226 L508 226 Z" />
      
      <!-- s -->
      <path d="M528 266 C528 250, 540 238, 556 238 C568 238, 576 244, 580 252 L568 258 C566 252, 562 248, 556 248 C550 248, 544 252, 544 258 C544 264, 550 266, 560 270 C574 274, 582 280, 582 292 C582 306, 570 316, 554 316 C538 316, 528 306, 524 296 L536 290 C538 296, 544 304, 554 304 C562 304, 568 298, 568 292 C568 286, 562 282, 552 278 C538 274, 528 272, 528 266 Z" />
    </g>

    <!-- 5. "CLOSET" IN BOLD TEAL SANS-SERIF -->
    <g fill="#008A90" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="64" letter-spacing="4">
      <text x="180" y="365">CLOSET</text>
    </g>
  </g>
</svg>
